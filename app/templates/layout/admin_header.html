<header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm z-10 shrink-0">
    <h2 class="text-lg font-bold text-slate-800">
        {% if active_tab == 'lich_lam_viec' %}Quản lý lịch làm việc
        {% elif active_tab == 'bac_si' %}Quản lý bác sĩ
        {% elif active_tab == 'benh_nhan' %} Quản lý bệnh nhân
        {% endif %}
    </h2>
    <div class="flex items-center gap-4">
        {% if current_user.is_authenticated %}
        <div class="text-right hidden sm:block">
            <p class="text-sm font-bold text-slate-900">{{ current_user.hoTen }}</p>
            <p class="text-xs text-slate-500">{{ current_user.email }}</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center font-bold uppercase">AD
        </div>
        {% endif %}
    </div>
</header>
