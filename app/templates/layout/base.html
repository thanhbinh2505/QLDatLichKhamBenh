<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{%block title%}Trang chủ{%endblock%}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="../../static/js/base.js" defer></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#1d4ed8', /* Medical Blue - blue-700 */
                        primaryHover: '#1e40af', /* blue-800 */
                        secondary: '#0d9488', /* Teal / Light Green - teal-600 */
                        lightBg: '#f8fafc', /* slate-50 */
                        darkBg: '#0f172a', /* slate-900 */
                        'medical-blue': '#1D4ED8', // blue-700
                        'medical-blue-hover': '#1E3A8A', // blue-900
                        'medical-blue-light': '#EFF6FF', // blue-50
                        medical: {
                        50: '#eff6ff',
                        100: '#dbeafe',
                        500: '#3b82f6',
                        600: '#2563eb', // Medical Blue chủ đạo
                        700: '#1d4ed8',
                    }
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(29, 78, 216, 0.15)',
                        'btn': '0 8px 20px -6px rgba(29, 78, 216, 0.4)',
                    }
                }
            }
        }
    </script>
    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="font-sans text-gray-800 antialiased bg-white">
    {%block header%}
    {%include 'layout/header.html'%}
    {%endblock%}

    {%block content required%}
    {%endblock%}

    {%block footer%}
    {%include 'layout/footer.html'%}
    {%endblock%}
    {% if request.endpoint == 'index' or request.endpoint == 'ho_so' %}
        <div id="floating-booking-btn" class="fixed bottom-10 right-10 z-[100] group opacity-0 translate-y-10 pointer-events-none transition-all duration-500 ease-out">
        <div class="absolute -inset-1.5 bg-gradient-to-r from-[#3b82f6] to-[#1d4ed8] rounded-full blur opacity-50 group-hover:opacity-100 transition duration-500 animate-pulse"></div>
        <a href="/dat-lich"
           class="relative flex items-center justify-center px-10 py-4 bg-gradient-to-br from-[#2563eb] to-[#1e3a8a] text-white rounded-full font-extrabold tracking-widest text-[15px] border border-blue-400/50 shadow-2xl transition-all duration-300 hover:scale-105 hover:-translate-y-1 overflow-hidden">
            <div class="absolute top-0 -inset-full h-full w-1/2 z-5 block transform -skew-x-12 bg-gradient-to-r from-transparent via-white/30 to-transparent opacity-0 group-hover:opacity-100 group-hover:animate-[shine_0.8s_ease-out]"></div>
            <span class="relative z-10 drop-shadow-md">Đặt Lịch Ngay</span>
        </a>
    </div>

    <style>
        @keyframes shine {
            100% { left: 200%; }
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const floatingBtn = document.getElementById("floating-booking-btn");
            if (!floatingBtn) return;
            const mainBtn = document.getElementById("main-booking-btn");
            if (mainBtn) {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (!entry.isIntersecting) {
                            floatingBtn.classList.remove("opacity-0", "translate-y-10", "pointer-events-none");
                            floatingBtn.classList.add("opacity-100", "translate-y-0", "pointer-events-auto");
                        } else {
                            floatingBtn.classList.add("opacity-0", "translate-y-10", "pointer-events-none");
                            floatingBtn.classList.remove("opacity-100", "translate-y-0", "pointer-events-auto");
                        }
                    });
                }, { threshold: 0 });
                observer.observe(mainBtn);
            } else {
                floatingBtn.classList.remove("opacity-0", "translate-y-10", "pointer-events-none");
                floatingBtn.classList.add("opacity-100", "translate-y-0", "pointer-events-auto");
            }
        });
    </script>
    {% endif %}


</body>
</html>
