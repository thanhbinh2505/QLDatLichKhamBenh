<header class="fixed w-full top-0 bg-white/95 backdrop-blur-sm shadow-sm z-50 border-b border-gray-100">
    <div class="w-full px-4 sm:px-6 lg:px-8 xl:px-12">
        <div class="flex justify-between items-center h-20 relative">
            <!-- Logo -->
            <div class="flex-shrink-0 flex items-center gap-2 cursor-pointer relative z-10">
                <i data-lucide="cross" class="h-8 w-8 text-primary"></i>
                <span class="font-bold text-2xl tracking-tight text-slate-900">Medi<span class="text-primary">Care</span></span>
            </div>

            <!-- Navigation (Desktop) - Căn giữa tuyệt đối để luôn cân bằng -->
            <nav class="hidden lg:flex space-x-6 lg:space-x-8 absolute left-1/2 transform -translate-x-1/2 w-max">
                <a href="#" class="text-slate-600 hover:text-primary font-medium transition-colors">Trang chủ</a>
                <a href="#about" class="text-slate-600 hover:text-primary font-medium transition-colors">Về chúng tôi</a>
                <a href="#services" class="text-slate-600 hover:text-primary font-medium transition-colors">Chuyên khoa</a>
                <a href="#doctors" class="text-slate-600 hover:text-primary font-medium transition-colors">Đội ngũ bác sĩ</a>
                <a href="#pricing" class="text-slate-600 hover:text-primary font-medium transition-colors">Bảng giá</a>
            </nav>

            <!-- Action Group (CTA & Avatar) -->
            <div class="flex items-center gap-3 md:gap-5 relative z-10">
                <!-- CTA Button -->
                <div class="hidden md:flex">
                    <a href="#appointment" class="bg-primary hover:bg-primaryHover text-white px-6 py-2.5 rounded-full font-semibold transition-all shadow-md shadow-primary/30 flex items-center gap-2">
                        <i data-lucide="calendar-plus" class="w-4 h-4"></i>
                        Đặt lịch khám
                    </a>
                </div>

                <!-- User Avatar (Login Link) -->
                <a href="/login" class="flex items-center justify-center w-10 h-10 rounded-full bg-slate-50 border border-slate-200 text-slate-600 hover:text-primary hover:border-primary transition-all shadow-sm" title="Đăng nhập / Tài khoản">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </a>

                <!-- Mobile menu button -->
                <div class="lg:hidden flex items-center">
                    <button class="text-slate-600 hover:text-primary focus:outline-none">
                        <i data-lucide="menu" class="h-6 w-6"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>
