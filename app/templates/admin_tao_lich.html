{% extends 'layout/base.html' %}

{% block title %}Tạo lịch làm việc - Admin{% endblock %}

{% block header %}{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<style>
    input[type="date"]::-webkit-calendar-picker-indicator {
        background: transparent;
        bottom: 0;
        color: transparent;
        cursor: pointer;
        height: auto;
        left: 0;
        position: absolute;
        right: 0;
        top: 0;
        width: auto;
    }
</style>
<div class="bg-slate-50 font-sans text-slate-900 min-h-screen flex flex-col">

    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shadow-sm shrink-0 sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <a href="/admin"
               class="p-2 -ml-2 text-slate-500 hover:text-primary hover:bg-blue-50 rounded-lg transition-colors"
               title="Quay lại danh sách">
                <i data-lucide="arrow-left" class="w-6 h-6"></i>
            </a>
            <h2 class="text-lg font-bold text-slate-800">Tạo lịch làm việc</h2>
        </div>
    </header>

    <main class="flex-1 flex flex-col p-6 gap-6 max-w-[1600px] mx-auto w-full">

        <div class="grid grid-cols-1 lg:grid-cols-2 items-center gap-4">
            <div class="flex">
                <div class="flex items-center bg-white p-1.5 rounded-xl shadow-sm border border-gray-200">
                    <div class="flex items-center gap-2 px-3 border-r border-gray-100 relative">
                        <span class="text-sm font-medium text-slate-500 whitespace-nowrap">Từ ngày</span>
                        <div class="relative w-36">
                            <i data-lucide="calendar"
                               class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-primary pointer-events-none"></i>
                            <input type="date" id="startDate"
                                   class="w-full pl-9 pr-2 py-2 text-sm font-semibold text-slate-700 bg-slate-50 hover:bg-blue-50/50 border border-transparent rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer">
                        </div>
                    </div>
                    <div class="flex items-center gap-2 px-3 relative">
                        <span class="text-sm font-medium text-slate-500 whitespace-nowrap">Đến ngày</span>
                        <div class="relative w-36">
                            <i data-lucide="calendar"
                               class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-primary pointer-events-none"></i>
                            <input type="date" id="endDate"
                                   class="w-full pl-9 pr-2 py-2 text-sm font-semibold text-slate-700 bg-slate-50 hover:bg-blue-50/50 border border-transparent rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all cursor-pointer">
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3">
                <button class="px-5 py-2.5 border border-gray-300 rounded-xl text-gray-700 hover:bg-gray-100 transition-colors font-medium text-sm">
                    Hủy
                </button>
                <button onclick="saveSchedule()" class="px-6 py-2.5 bg-primary text-white rounded-xl shadow-btn hover:bg-primaryHover hover:-translate-y-0.5 transition-all font-medium text-sm flex items-center gap-2">
                    <i data-lucide="save" class="w-4 h-4"></i> Lưu lịch làm việc
                </button>
            </div>
        </div>

        <div class="flex-1 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden min-h-[600px]">

            <div class="grid grid-cols-[110px_repeat(7,1fr)] bg-slate-50/80 border-b border-gray-200">
                <div class="p-3 border-r border-gray-200"></div>
                <div id="grid-headers" class="contents"></div>
            </div>

            <div id="dsCaLamGrid" class="flex-1 flex flex-col">
                </div>

        </div>
    </main>

    <div id="popoverBackdrop" class="hidden fixed inset-0 z-40 bg-transparent" onclick="closePopover()"></div>

    <div id="doctorPopover"
         class="hidden fixed z-50 w-80 bg-white rounded-xl shadow-2xl border border-gray-200 flex flex-col overflow-hidden transition-all duration-200 origin-top">
        <div class="p-3 border-b border-gray-100 bg-slate-50">
            <div class="relative">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                <input type="text" id="doctorSearch" placeholder="Tìm kiếm bác sĩ theo tên..."
                       class="w-full pl-9 pr-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all bg-white">
            </div>
        </div>

        <div id="doctorList" class="flex-1 overflow-y-auto max-h-[300px] p-2 space-y-1 scrollbar-hide">
        </div>

        <div class="p-3 border-t border-gray-100 bg-slate-50 flex items-center justify-between">
            <span class="text-sm font-medium text-slate-600">Đã chọn: <b id="selectedCount" class="text-primary text-base">0</b></span>
            <button onclick="confirmSelection()"
                    class="px-5 py-2 bg-primary text-white text-sm font-medium rounded-lg hover:bg-primaryHover transition-colors shadow-btn">
                Thêm vào ca
            </button>
        </div>
    </div>
</div>

<script>
    const dsCaLam = {{ ds_calam | tojson | safe }};
    const defaultStartDate = "{{ ngay_bat_dau_goi_y }}";
    const defaultEndDate = "{{ ngay_ket_thuc_goi_y }}";
</script>

<script src="{{ url_for('static', filename='js/tao_lich_lam.js') }}"></script>

{% endblock %}
