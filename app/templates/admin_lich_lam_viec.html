{% extends 'layout/admin_base.html' %}

{% block content_admin %}
<div class="max-w-7xl mx-auto space-y-3 flex-1 flex flex-col min-h-0 w-full">

    <div class="flex flex-col xl:flex-row lg:items-center lg:justify-between gap-4 sm:gap-6 w-full mt-3 p-0 bg-slate-50/50 rounded-2xl shrink-0">

        <div class="flex justify-start w-full order-2 xl:order-1">
            <div class="flex items-center justify-between sm:justify-start w-full sm:w-auto gap-1 sm:gap-2 bg-white p-1.5 sm:p-2 rounded-xl border border-gray-200 shadow-sm">
                <button class="p-1.5 sm:p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors shrink-0"
                        title="Tuần trước"
                        onclick="changeWeek('prev')">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>

                <div class="flex flex-col sm:flex-row items-center gap-1.5 sm:gap-4 px-1 sm:px-2 min-w-max">
                    <span class="font-bold text-slate-800 text-xs sm:text-sm" id="weekSpan">Tuần: {{thu_2}} - {{chu_nhat}}</span>
                    <button onclick="changeWeek('current')" class="text-[10px] sm:text-xs font-semibold px-2 sm:px-2.5 py-1 sm:py-1.5 border border-gray-200 text-slate-600 rounded-lg hover:bg-slate-50 hover:text-primary hover:border-primary/30 transition-all">
                        Tuần hiện tại
                    </button>
                </div>

                <button class="p-1.5 sm:p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors shrink-0"
                        title="Tuần sau"
                        onclick="changeWeek('next')">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <div class="flex flex-col order-1 xl:order-2 sm:flex-row lg:justify-between justify-end items-stretch sm:items-center gap-4 w-full">
            <div class="relative w-full sm:max-w-md group">
                <i data-lucide="search"
                   class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5 group-focus-within:text-primary transition-colors"></i>
                <input type="text" placeholder="Tìm kiếm theo tên bác sĩ..."
                       class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary bg-white transition-all text-sm shadow-sm placeholder:text-gray-400">
            </div>

            <a href="/admin/tao-lich"
               class="w-full sm:w-auto bg-primary hover:bg-primaryHover text-white px-5 py-2.5 rounded-xl flex items-center justify-center gap-2 font-medium shadow-btn transition-all duration-300 transform hover:-translate-y-0.5 whitespace-nowrap cursor-pointer">
                <i data-lucide="plus" class="w-5 h-5"></i>
                Tạo lịch làm việc
            </a>
        </div>

    </div>

    <!-- 3. Bảng Lịch Làm Việc (Bottom Section) -->
    <div class="flex-1 bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden flex flex-col min-h-0">
        <div class="overflow-auto flex-1 custom-scrollbar relative min-h-0">
            <table class="w-full text-sm text-left border-collapse min-w-[1000px]">
                <!-- Hàng tiêu đề (Thứ & Ngày) -->
                <thead class="bg-slate-50 text-slate-600 border-b border-gray-200 sticky top-0 z-10 shadow-sm" id="scheduleThead">

                </thead>

                <!-- Các hàng nội dung -->
                <tbody class="divide-y divide-gray-200" id="scheduleBody">

                </tbody>
            </table>
        </div>
    </div>

</div>

<script>

    const dsCaLam = {{ ds_calam | tojson | safe }};
    const thu2 = "{{thu_2}}";
    const chuNhat= "{{chu_nhat}}";

</script>

<script src="{{ url_for('static', filename='js/admin.js') }}"></script>

{%endblock%}
